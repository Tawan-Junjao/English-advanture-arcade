<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>English Adventure V10</title><link rel="stylesheet" href="style.css?v=10001"></head><body>
<main id="app">
<section id="menu" class="screen active"><div class="card"><h1>English Adventure</h1><p>V10.0 Foundation</p><button id="playBtn">▶ PLAY</button><button id="continueBtn">↻ CONTINUE</button><button id="parentBtn">📊 PARENTS</button><button id="settingsBtn">⚙️ SETTINGS</button><small>Build 10.0.0 — No Service Worker</small></div></section>
<section id="gameScreen" class="screen"><header><button id="homeBtn">⌂</button><b>🪙 <span id="coinCount">0</span></b><b>⭐ <span id="starCount">0</span></b><b>❤️❤️❤️</b></header><canvas id="gameCanvas" width="960" height="540"></canvas>
<div id="wordGate" class="modal hidden"><div class="gate"><div id="gatePicture">🍎</div><h2>เปิดประตูคำศัพท์</h2><button id="hearWordBtn">🔊 ฟังคำ</button><button id="hearSpellBtn">🔤 ฟังสะกด</button><div id="slots"></div><div id="letters"></div><p id="gateMessage"></p></div></div>
<div class="controls"><button id="leftBtn">◀</button><button id="jumpBtn">▲</button><button id="rightBtn">▶</button></div></section>
<section id="parents" class="screen"><div class="card"><button class="backBtn">← กลับ</button><h2>ผลการเล่น</h2><p>เหรียญ <b id="pCoins">0</b></p><p>ดาว <b id="pStars">0</b></p><p>คำที่ผ่าน <b id="pWords">0</b></p><button id="resetBtn">ล้างข้อมูล</button></div></section>
<section id="settings" class="screen"><div class="card"><button class="backBtn">← กลับ</button><h2>ตั้งค่าเสียง</h2><select id="voiceSelect"></select><input id="voiceRate" type="range" min=".6" max="1" step=".05" value=".78"><button id="testVoiceBtn">ทดสอบ apple</button></div></section>
</main><script src="src/main.js?v=10001"></script></body></html>
